name: Deploy

# Toda tag v* publica num alias próprio da versão (nunca em produção).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  NETLIFY_CLI_VERSION: 27.16.3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Alias da versão
        id: alias
        run: |
          ALIAS=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
      - name: Deploy no Netlify (sem --prod)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes "netlify-cli@${NETLIFY_CLI_VERSION}" deploy \
            --dir dist \
            --no-build \
            --alias "${{ steps.alias.outputs.alias }}" \
            --message "${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
      - name: Link da versão
        run: |
          URL="https://${{ steps.alias.outputs.alias }}--runesling.netlify.app"
          echo "### RuneSling ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Link de teste: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
